<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piquify — Tablero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Outfit:wght@500;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: #f5faf7;
            color: #0f2e2a;
            overflow-x: hidden;
        }
        .font-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
        .font-display { font-family: 'Outfit', sans-serif; }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }
        html { scroll-behavior: smooth; }
        .logo-card { transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .logo-card:hover { transform: translateY(-4px); }
        .logo-canvas { position: relative; transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .logo-card:hover .logo-canvas { transform: scale(1.04); }
        .logo-aura {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(0,137,123,0.22) 0%, transparent 70%);
            border-radius: 50%;
            transform: scale(0.5);
            opacity: 0;
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            filter: blur(40px);
            pointer-events: none;
        }
        .logo-card:hover .logo-aura { transform: scale(1); opacity: 1; }
        .divider-line {
            width: 0;
            height: 1px;
            background: #0f2e2a;
            opacity: 0.2;
            transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .logo-card:hover .divider-line { width: 100%; }
        .tracking-ultra-wide { letter-spacing: 0.2em; }
        .text-balance { text-wrap: balance; }
        .swatch {
            width: 18px; height: 18px; border-radius: 999px;
            box-shadow: inset 0 0 0 1px rgb(15 46 42 / 0.12);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const pulse = (el) => (
            <animate attributeName="opacity" values="1;0.4;1" dur="3.4s" repeatCount="indefinite"/>
        );

        const Casilla = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
                <defs>
                    <mask id="casilla-hoyo-ui">
                        <rect width="100" height="100" fill="white"/>
                        <circle cx="42" cy="60" r="9" fill="black"/>
                    </mask>
                </defs>
                <g fill="currentColor">
                    <rect x="18" y="26" width="58" height="58" rx="14" mask="url(#casilla-hoyo-ui)"/>
                    <circle cx="70" cy="32" r="8">{pulse()}</circle>
                </g>
            </svg>
        );

        const Damas = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
                <g fill="currentColor">
                    <rect x="18" y="18" width="26" height="26" rx="6"/>
                    <rect x="52" y="18" width="26" height="26" rx="6"/>
                    <rect x="18" y="52" width="26" height="26" rx="6"/>
                    <circle cx="65" cy="65" r="9">{pulse()}</circle>
                </g>
            </svg>
        );

        const Pista = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
                <g fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M34 22 H70 a8 8 0 0 1 8 8 V70 a8 8 0 0 1 -8 8 H30 a8 8 0 0 1 -8 -8 V42"/>
                    <path d="M46 22 v8"/>
                    <path d="M58 22 v8"/>
                    <path d="M78 46 h-8"/>
                    <path d="M78 58 h-8"/>
                </g>
            </svg>
        );

        const Mesa = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
                <rect x="18" y="18" width="64" height="64" rx="16" fill="none" stroke="currentColor" strokeWidth="3.5"/>
                <g fill="currentColor">
                    <circle cx="38" cy="64" r="8"/>
                    <circle cx="66" cy="40" r="6">{pulse()}</circle>
                    <circle cx="46" cy="42" r="4"/>
                </g>
            </svg>
        );

        const Sesgo = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
                <rect x="22" y="22" width="56" height="56" rx="12" fill="none" stroke="currentColor" strokeWidth="3.5"/>
                <line x1="38" y1="62" x2="56" y2="44" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
                <circle cx="64" cy="36" r="5.5" fill="currentColor">{pulse()}</circle>
            </svg>
        );

        const Cruce = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
                <g fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round">
                    <path d="M36 22 V78"/>
                    <path d="M64 22 V78"/>
                    <path d="M22 36 H78"/>
                    <path d="M22 64 H78"/>
                </g>
                <g fill="currentColor">
                    <circle cx="36" cy="64" r="8"/>
                    <circle cx="64" cy="36" r="5">{pulse()}</circle>
                </g>
            </svg>
        );

        const logos = [
            {
                Component: Casilla,
                title: "Casilla",
                subtitle: "Geometría · bote",
                file: "variants/tablero-casilla.svg",
                philosophy: "Una baldosa basta para decir tablero. El hueco redondo es el bote del pique; la ficha en la esquina es quien se sienta a jugar."
            },
            {
                Component: Damas,
                title: "Damas",
                subtitle: "Matriz · tres casillas",
                file: "variants/tablero-damas.svg",
                philosophy: "Un tablero de 2×2 al que le falta una casilla. Esa ausencia es el asiento libre, y la ficha redonda es el amigo que ya entró."
            },
            {
                Component: Pista,
                title: "Pista",
                subtitle: "Líneas · circuito",
                file: "variants/tablero-pista.svg",
                philosophy: "El recorrido de un juego de mesa: cuadrado, casillas marcadas y una esquina abierta. Esa abertura es la salida del pique, no un trazo a medias."
            },
            {
                Component: Mesa,
                title: "Mesa",
                subtitle: "Marco · tres jugadores",
                file: "variants/tablero-mesa.svg",
                philosophy: "El playground es el marco. Dentro, tres pesos distintos: el grupo no es simétrico, y el punto grande es quien lleva la mano."
            },
            {
                Component: Sesgo,
                title: "Sesgo",
                subtitle: "Casilla · envite",
                file: "variants/tablero-sesgo.svg",
                philosophy: "La casilla está vacía hasta que alguien marca. El trazo diagonal es el envite; la ficha cierra el gesto, como quien apuesta una opción."
            },
            {
                Component: Cruce,
                title: "Cruce",
                subtitle: "Red · dos rivales",
                file: "variants/tablero-cruce.svg",
                philosophy: "Cuatro líneas, cuatro cruces, dos fichas. Se lee como un tablero de estrategia: hay enfrentamiento, y también cruces libres donde aún se puede entrar."
            }
        ];

        const LogoShowcase = () => {
            const [ink, setInk] = React.useState("#0f2e2a");
            return (
                <div className="min-h-screen flex flex-col items-center py-20 px-6">
                    <div className="text-center mb-16 max-w-3xl">
                        <h1 className="font-display text-6xl md:text-7xl font-bold tracking-tight mb-6">
                            Piquify
                        </h1>
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide mb-6">
                            Tablero de juego
                        </p>
                        <p className="text-sm opacity-70 max-w-xl mx-auto mb-8 font-light leading-relaxed">
                            Seis formas de decir playground: baldosa, damas, circuito, mesa, casilla marcada y cruce. Elige dos o tres para afinar.
                        </p>
                        <div className="flex flex-wrap items-center justify-center gap-3 mb-8">
                            {[
                                ["#0f2e2a", "Abismo"],
                                ["#00897b", "Marea"],
                                ["#c77d2e", "Madera"],
                                ["#f05d5e", "Coral"],
                            ].map(([hex, name]) => (
                                <button
                                    key={hex}
                                    type="button"
                                    onClick={() => setInk(hex)}
                                    className="flex items-center gap-2 rounded-full border border-[#0f2e2a]/10 bg-white px-3 py-1.5 text-xs"
                                    aria-pressed={ink === hex}
                                >
                                    <span className="swatch" style={{ background: hex }}></span>
                                    {name}
                                </button>
                            ))}
                        </div>
                        <div className="w-12 h-[1px] bg-[#0f2e2a] mx-auto opacity-30"></div>
                    </div>

                    <div className="max-w-7xl w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16 mb-24">
                        {logos.map((logo) => (
                            <div key={logo.title} className="flex flex-col items-center logo-card">
                                <div className="w-64 h-64 mb-6 flex items-center justify-center relative rounded-[2rem] bg-white shadow-[0_1px_2px_rgb(15_46_42_/_0.06),0_8px_24px_-12px_rgb(15_46_42_/_0.18)]">
                                    <div className="logo-aura"></div>
                                    <div className="w-32 h-32 relative z-10 logo-canvas" style={{ color: ink }}>
                                        <logo.Component />
                                    </div>
                                </div>
                                <div className="mb-8 flex h-9 w-9 items-center justify-center rounded-xl bg-[#00897b] text-[#f5faf7]" aria-hidden>
                                    <div className="h-5 w-5"><logo.Component /></div>
                                </div>
                                <div className="text-center w-full px-4">
                                    <h2 className="text-xl font-medium tracking-wider mb-2 uppercase">
                                        {logo.title}
                                    </h2>
                                    <h3 className="text-xs font-mono opacity-50 tracking-widest mb-6">
                                        {logo.subtitle}
                                    </h3>
                                    <p className="text-sm leading-relaxed opacity-70 text-left font-light text-balance">
                                        {logo.philosophy}
                                    </p>
                                    <a href={logo.file} download className="mt-4 inline-block font-mono text-[11px] uppercase tracking-widest opacity-50 hover:opacity-100">
                                        Descargar SVG
                                    </a>
                                </div>
                                <div className="divider-line mt-8 mx-auto"></div>
                            </div>
                        ))}
                    </div>

                    <div className="mt-8 max-w-2xl text-center">
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide leading-loose">
                            Piquify · logo generator<br/>
                            2026
                        </p>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<LogoShowcase />, document.getElementById('root'));
    </script>
</body>
</html>
